default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  port: 5432

development:
  <<: *default
  database: pet_tamagotchi_development

test:
  <<: *default
  database: pet_tamagotchi_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    database: pet_tamagotchi_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: pet_tamagotchi_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: pet_tamagotchi_production_cable
    migrations_paths: db/cable_migrate
